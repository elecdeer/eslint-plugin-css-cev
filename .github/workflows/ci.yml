name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node.js / pnpm / 依存関係のインストールまで setup-vp がまとめて行う
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true

      # 全チェックの結果をまとめて Job Summary に出すため、各ステップは失敗しても続行する
      - name: Check (format / lint / type check)
        id: check
        continue-on-error: true
        run: vp check

      - name: Test
        id: test
        continue-on-error: true
        run: vp test

      - name: Build
        id: build
        continue-on-error: true
        run: vp run build

      - name: Report results
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          FAILED=0
          {
            echo "## CI Results"
            echo "| Step | Result |"
            echo "|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          report() {
            if [ "$2" = "success" ]; then
              echo "| $1 | ✅ Passed |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | ❌ $2 |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          }
          report "vp check" "$CHECK_OUTCOME"
          report "vp test" "$TEST_OUTCOME"
          report "build" "$BUILD_OUTCOME"

          if [ "$FAILED" -eq 1 ]; then exit 1; fi
